image:
  repository: ghcr.io/abmania/whosaid-rs
  pullPolicy: IfNotPresent
  tag: main@sha256:20f7121f2c0bc308b3591caadeac27d99b23ef943d7b07fd0a5de44e955a2745

workload:
  main:
    podSpec:
      containers:
        main:
          env:
            WHOSAID_DISCORD_TOKEN: "DISCORD_TOKEN"
            WHOSAID_DATABASE_URL:
              secretKeyRef:
                name: cnpg-main-urls
                key: std

          probes:
            liveness:
              enabled: false
            readiness:
              enabled: false
            startup:
              enabled: false
service:
  main:
    enabled: false
    ports:
      main:
        enabled: false

cnpg:
  main:
    enabled: true
    user: whosaid
    database: whosaid

# common >= 25 sets hostUsers: false on Kubernetes >= 1.33 (user namespaces).
# Talos disables user namespaces (user.max_user_namespaces=0), so pods fail
# with "failed to start noop process for unshare: no space left on device".
podOptions:
  hostUsers: true
