image:
  repository: ghcr.io/abmania/whosaid-rs
  pullPolicy: IfNotPresent
  tag: main@sha256:c39848b9c546dfc39c5751aee7c7abd57ec5b8a7001ad6d3899945713f1190ab

workload:
  main:
    podSpec:
      containers:
        main:
          env:
            WHOSAID_DISCORD_TOKEN: "DISCORD_TOKEN"
            WHOSAID_DATABASE_URL:
              secretKeyRef:
                name: cnpg-main-urls
                key: std

          probes:
            liveness:
              enabled: false
            readiness:
              enabled: false
            startup:
              enabled: false
service:
  main:
    enabled: false
    ports:
      main:
        enabled: false

cnpg:
  main:
    enabled: true
    user: whosaid
    database: whosaid

# common >= 25 sets hostUsers: false on Kubernetes >= 1.33 (user namespaces).
# Talos disables user namespaces (user.max_user_namespaces=0), so pods fail
# with "failed to start noop process for unshare: no space left on device".
podOptions:
  hostUsers: true
